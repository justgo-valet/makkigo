services:
  postgres:
    image: postgres:16-alpine
    container_name: makkigo-postgres
    restart: unless-stopped
    env_file:
      - .env.development # 개발 환경의 환경 변수 파일을 사용합니다. 변경이 필요하면 다른 환경 파일로 교체할 수 있습니다.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
